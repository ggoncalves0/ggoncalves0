name: Estatísticas do GitHub

on:
  schedule:
    - cron: "0 3 * * *" # todo dia à meia-noite de Brasília (03:00 UTC)
  workflow_dispatch: # permite rodar na mão pela aba Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/estatisticas.yml"

# Evita que duas execuções tentem salvar as imagens ao mesmo tempo.
concurrency:
  group: estatisticas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # para salvar as imagens no repositório
    steps:
      - uses: actions/checkout@v7

      - name: Rodar os testes
        run: python3 -m unittest -v

      - name: Gerar o painel de estatísticas
        run: python3 scripts/gerar_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Salvar as imagens, se mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          if git diff --staged --quiet; then
            echo "As estatísticas não mudaram."
          else
            git commit -m "Atualiza as estatísticas do GitHub"
            git pull --rebase
            git push
          fi
