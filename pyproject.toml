# Padrão de código dos scripts, verificado com o Ruff (https://docs.astral.sh/ruff/):
#   ruff check .   (erros e más práticas)
#   ruff format .  (formatação)

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "RET", "PTH"]
